spring.datasource.url=jdbc:h2:mem:lankastay;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
lankastay.security.bootstrap-admin-email=
lankastay.security.bootstrap-admin-temp-password=
lankastay.security.ip-max-attempts=100
file.upload-dir=${java.io.tmpdir}/lankastay-test-uploads
